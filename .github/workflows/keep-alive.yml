name: Render Self Keep Alive Cron

on:
  schedule:
    # Runs every 10 minutes (Render free tier sleeps after 15 mins of inactivity)
    - cron: '*/10 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ping-self-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ping Self Backend Health Endpoint
        run: |
          echo "Pinging Render Backend..."
          curl -sL --retry 3 --max-time 60 "https://home-services-backend-b6v4.onrender.com/health" || true
          echo ""
          echo "Ping completed at $(date)"
